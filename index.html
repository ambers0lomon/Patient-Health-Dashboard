<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMART on FHIR — Patient Health Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #1f2937; background: #f9fafb; }
    h1 { color: #111827; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 1.25rem; margin-bottom: 1.5rem; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .row-form { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    input, select { flex: 1; min-width: 150px; padding: 0.6rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; background: #fff; }
    button { padding: 0.6rem 1.2rem; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    button.green-btn { background: #059669; }
    button.green-btn:hover { background: #047857; }
    .patient-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 0; border-bottom: 1px solid #f3f4f6; }
    .patient-item:last-child { border-bottom: none; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid #e5e7eb; }
    th { background: #f3f4f6; font-weight: 600; }
    .status { color: #6b7280; font-style: italic; margin-top: 0.5rem; }
    .chart-box { max-height: 300px; margin-bottom: 1.5rem; }
  </style>
</head>
<body>

  <h1>Patient Health Dashboard</h1>

  <!-- 1. Search Patient -->
  <div class="card">
    <h2>1. Search Patient</h2>
    <div class="row-form">
      <input type="text" id="lastNameInput" placeholder="Enter last name (e.g., Karlinsky)" value="Karlinsky" />
      <button onclick="searchPatients()">Search</button>
    </div>
    <p id="searchStatus" class="status"></p>
    <div id="patientList"></div>
  </div>

  <!-- 2. Patient Chart, Write-Back Form & Table -->
  <div class="card" id="vitalsSection" style="display:none;">
    <h2 id="selectedPatientHeader">2. Clinical Observations</h2>

    <!-- Write-Back Form (POST /Observation) -->
    <div style="background: #f0fdf4; border: 1px solid #bbf7d0; padding: 1rem; border-radius: 6px; margin-bottom: 1.25rem;">
      <strong style="display:block; margin-bottom: 0.5rem; color: #166534;">+ Log New Observation (Write Back to FHIR Server)</strong>
      <div class="row-form">
        <select id="obsTypeSelect" onchange="updateInputPlaceholder()">
          <option value="weight">Body Weight (lbs)</option>
          <option value="glucose">Blood Glucose / Sugar (mg/dL)</option>
        </select>
        <input type="number" step="0.1" id="newObsValueInput" placeholder="Enter weight in lbs (e.g., 160.5)" />
        <button class="green-btn" onclick="submitNewObservation()">Save to Chart</button>
      </div>
      <p id="postStatus" class="status" style="margin-bottom:0;"></p>
    </div>

    <!-- Visual Line Chart (Chart.js) -->
    <div class="chart-box">
      <canvas id="vitalsChart"></canvas>
    </div>

    <!-- Clean Data Table -->
    <p id="vitalsStatus" class="status"></p>
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Observation</th>
          <th>Value</th>
        </tr>
      </thead>
      <tbody id="vitalsTableBody"></tbody>
    </table>
  </div>

  <script>
    const BASE_URL = "https://hapi.fhir.org/baseR4";
    let currentPatientId = null;
    let currentPatientName = "";
    let chartInstance = null;

    // Lookup dictionary mapping dropdown choice -> official FHIR LOINC & UCUM codes
    const OBSERVATION_TEMPLATES = {
      weight: {
        categoryCode: "vital-signs",
        categoryDisplay: "Vital Signs",
        loincCode: "29463-7",
        loincDisplay: "Body Weight",
        text: "Body Weight",
        unit: "lbs",
        ucumCode: "[lb_av]",
        placeholder: "Enter weight in lbs (e.g., 160.5)"
      },
      glucose: {
        categoryCode: "laboratory",
        categoryDisplay: "Laboratory",
        loincCode: "2339-0",
        loincDisplay: "Glucose [Mass/volume] in Blood",
        text: "Blood Glucose",
        unit: "mg/dL",
        ucumCode: "mg/dL",
        placeholder: "Enter blood sugar in mg/dL (e.g., 98)"
      }
    };

    function updateInputPlaceholder() {
      const selected = document.getElementById("obsTypeSelect").value;
      document.getElementById("newObsValueInput").placeholder = OBSERVATION_TEMPLATES[selected].placeholder;
    }

    async function searchPatients() {
      const familyName = document.getElementById("lastNameInput").value.trim();
      const statusEl = document.getElementById("searchStatus");
      const listEl = document.getElementById("patientList");
      
      if (!familyName) return;
      statusEl.textContent = "Searching HAPI FHIR server...";
      listEl.innerHTML = "";

      try {
        const res = await fetch(`${BASE_URL}/Patient?family=${encodeURIComponent(familyName)}&_count=25`, {
          headers: { "Accept": "application/fhir+json" }
        });
        const bundle = await res.json();

        if (!bundle.entry || bundle.entry.length === 0) {
          statusEl.textContent = "No patients found with that last name.";
          return;
        }

        statusEl.textContent = `Showing ${bundle.entry.length} matching patients:`;

        bundle.entry.forEach(({ resource }) => {
          const nameObj = resource.name?.[0] || {};
          const fullName = `${(nameObj.given || []).join(" ")} ${nameObj.family || ""}`.trim() || "Unnamed Patient";
          const gender = resource.gender || "unknown";
          const birthDate = resource.birthDate || "N/A";

          const row = document.createElement("div");
          row.className = "patient-item";
          row.innerHTML = `
            <div>
              <strong>${fullName}</strong> (ID: ${resource.id})<br/>
              <small>Gender: ${gender} | DOB: ${birthDate}</small>
            </div>
            <button onclick="loadObservations('${resource.id}', '${fullName.replace(/'/g, "\\'")}')">View Vitals</button>
          `;
          listEl.appendChild(row);
        });
      } catch (err) {
        statusEl.textContent = `Error: ${err.message}`;
      }
    }

    async function loadObservations(patientId, patientName) {
      currentPatientId = patientId;
      currentPatientName = patientName;

      const section = document.getElementById("vitalsSection");
      const header = document.getElementById("selectedPatientHeader");
      const statusEl = document.getElementById("vitalsStatus");
      const tbody = document.getElementById("vitalsTableBody");

      section.style.display = "block";
      header.textContent = `2. Clinical Observations — ${patientName} (ID: ${patientId})`;
      statusEl.textContent = "Fetching observations...";
      tbody.innerHTML = "";

      try {
        const res = await fetch(`${BASE_URL}/Observation?patient=${patientId}&_sort=-date&_count=25`, {
          headers: { "Accept": "application/fhir+json" }
        });
        const bundle = await res.json();

        const weightPoints = [];
        const glucosePoints = [];

        if (!bundle.entry || bundle.entry.length === 0) {
          statusEl.textContent = "No Observation records yet. Add one above to create the first entry!";
          renderChart([], []);
          return;
        }

        statusEl.textContent = `Loaded ${bundle.entry.length} records:`;

        bundle.entry.forEach(({ resource }) => {
          const date = resource.effectiveDateTime ? resource.effectiveDateTime.split("T")[0] : "N/A";
          const obsName = resource.code?.text || resource.code?.coding?.[0]?.display || "Unknown Observation";
          const lowerName = obsName.toLowerCase();
          
          let valueStr = "N/A";
          if (resource.valueQuantity) {
            valueStr = `${resource.valueQuantity.value} ${resource.valueQuantity.unit || ""}`.trim();
            
            if (typeof resource.valueQuantity.value === "number") {
              if (lowerName.includes("weight")) {
                const rawUnit = (resource.valueQuantity.unit || "").toLowerCase();
                const lbs = rawUnit.includes("kg")
                  ? Number((resource.valueQuantity.value * 2.20462).toFixed(1))
                  : resource.valueQuantity.value;
                weightPoints.push({ date, value: lbs });
              } else if (lowerName.includes("glucose") || lowerName.includes("sugar")) {
                glucosePoints.push({ date, value: resource.valueQuantity.value });
              }
            }
          } else if (resource.component) {
            valueStr = resource.component.map(c => {
              const label = c.code?.coding?.[0]?.display || "";
              const val = c.valueQuantity ? `${c.valueQuantity.value} ${c.valueQuantity.unit || ""}` : "";
              return `${label}: ${val}`;
            }).join(" / ");
          } else if (resource.valueString) {
            valueStr = resource.valueString;
          }

          const tr = document.createElement("tr");
          tr.innerHTML = `<td>${date}</td><td>${obsName}</td><td>${valueStr}</td>`;
          tbody.appendChild(tr);
        });

        renderChart(weightPoints.reverse(), glucosePoints.reverse());
      } catch (err) {
        statusEl.textContent = `Error loading vitals: ${err.message}`;
      }
    }

    async function submitNewObservation() {
      const obsType = document.getElementById("obsTypeSelect").value;
      const val = parseFloat(document.getElementById("newObsValueInput").value);
      const postStatus = document.getElementById("postStatus");
      const template = OBSERVATION_TEMPLATES[obsType];

      if (!currentPatientId || isNaN(val)) {
        postStatus.textContent = "Please select a patient and enter a valid number first.";
        return;
      }

      postStatus.textContent = `Saving ${template.text} to HAPI FHIR...`;

      const fhirPayload = {
        resourceType: "Observation",
        status: "final",
        category: [{
          coding: [{
            system: "http://terminology.hl7.org/CodeSystem/observation-category",
            code: template.categoryCode,
            display: template.categoryDisplay
          }]
        }],
        code: {
          coding: [{
            system: "http://loinc.org",
            code: template.loincCode,
            display: template.loincDisplay
          }],
          text: template.text
        },
        subject: { reference: `Patient/${currentPatientId}` },
        effectiveDateTime: new Date().toISOString(),
        valueQuantity: {
          value: val,
          unit: template.unit,
          system: "http://unitsofmeasure.org",
          code: template.ucumCode
        }
      };

      try {
        const res = await fetch(`${BASE_URL}/Observation`, {
          method: "POST",
          headers: {
            "Accept": "application/fhir+json",
            "Content-Type": "application/fhir+json"
          },
          body: JSON.stringify(fhirPayload)
        });

        if (res.status === 201) {
          postStatus.textContent = `Saved ${template.text}: ${val} ${template.unit}! Refreshing...`;
          document.getElementById("newObsValueInput").value = "";
          await loadObservations(currentPatientId, currentPatientName);
        } else {
          postStatus.textContent = `Server returned status ${res.status}`;
        }
      } catch (err) {
        postStatus.textContent = `Error saving observation: ${err.message}`;
      }
    }

    function renderChart(weightPoints, glucosePoints) {
      const ctx = document.getElementById("vitalsChart").getContext("2d");
      if (chartInstance) {
        chartInstance.destroy();
      }

      // Combine all unique dates across both weight and blood sugar readings
      const allDates = Array.from(new Set([
        ...weightPoints.map(p => p.date),
        ...glucosePoints.map(p => p.date)
      ])).sort();

      const weightSeries = allDates.map(d => weightPoints.find(p => p.date === d)?.value ?? null);
      const glucoseSeries = allDates.map(d => glucosePoints.find(p => p.date === d)?.value ?? null);

      chartInstance = new Chart(ctx, {
        type: "line",
        data: {
          labels: allDates,
          datasets: [
            {
              label: "Body Weight (lbs)",
              data: weightSeries,
              borderColor: "#2563eb",
              backgroundColor: "rgba(37, 99, 235, 0.1)",
              spanGaps: true,
              tension: 0.25
            },
            {
              label: "Blood Glucose (mg/dL)",
              data: glucoseSeries,
              borderColor: "#dc2626",
              backgroundColor: "rgba(220, 38, 38, 0.1)",
              spanGaps: true,
              tension: 0.25
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            title: { display: true, text: "Patient Vitals & Lab Trends Over Time" }
          }
        }
      });
    }
  </script>
</body>
</html>
